[workspace]
resolver = "3"
members = ["crates/acc-ui", "crates/acc-ui-agent", "crates/acc-ui-ffi"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
repository = "https://github.com/lum1n/acc-ui"
license = "MIT"
publish = false

[workspace.dependencies]
acc-ui = { path = "crates/acc-ui" }
acc-ui-agent = { path = "crates/acc-ui-agent" }
pulldown-cmark = { version = "0.13", default-features = false }
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11"
thiserror = "2"
uniffi = "0.32"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
panic = "unwind" # UniFFI catches panics at the FFI boundary; keep unwinding on.
